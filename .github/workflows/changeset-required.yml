name: Changeset Required

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changeset-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Shallow checkout — the changeset lint computes the three-dot
          # diff `origin/${base}...HEAD`, which needs both branches plus their
          # merge-base in history. 50 commits is enough for >99% of realistic
          # PRs and is dramatically faster than `fetch-depth: 0`. (#319)
          fetch-depth: 50
      - name: Fetch base ref for diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --depth=50 origin "${BASE_REF}:refs/remotes/origin/${BASE_REF}"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run changeset lint
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: node scripts/changeset/lint.cjs
